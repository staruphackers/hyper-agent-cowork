name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Fork: run this repository's own pr-trusted.yml. Calling upstream
    # paperclipai/paperclip@master runs checks for files the fork has not
    # synced yet, so every PR goes red between upstream syncs.
    uses: ./.github/workflows/pr-trusted.yml
